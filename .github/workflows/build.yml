name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # The .NET Framework C# compiler ships with Windows, so no SDK or Visual Studio is needed.
      - name: Build
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:x64 /optimize+ /warnaserror+ /out:PlexLauncher.exe PlexLauncher.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { $env:GITHUB_SHA.Substring(0, 7) }
          $archive = "plex-windows-scaling-fix-$version-windows-x64.zip"
          Compress-Archive -Path PlexLauncher.exe, LICENSE -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "$archive.sha256"
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: plex-windows-scaling-fix-windows-x64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "${{ steps.package.outputs.archive }}"
          "${{ steps.package.outputs.archive }}.sha256"
          --verify-tag
          --generate-notes
          --title "Plex Windows Scaling Fix ${{ github.ref_name }}"
        shell: pwsh
